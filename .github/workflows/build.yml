name: Build & Test

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libffi-dev libsdl2-dev xvfb
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build the React UI bindings
        run: yarn build:ui
      - name: Bundle demos and tests
        run: yarn bundle
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_LVGL_SIMULATOR=ON
      - name: Build lvgljs
        run: cmake --build build -j
      - name: Run tests
        run: xvfb-run -a node scripts/ci-run-tests.js build/lvgljs

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system dependencies
        run: brew install ninja sdl2 libffi
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build the React UI bindings
        run: yarn build:ui
      - name: Bundle demos and tests
        run: yarn bundle
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_LVGL_SIMULATOR=ON
          -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2);$(brew --prefix libffi)"
      - name: Build lvgljs
        run: cmake --build build -j
      - name: Run tests
        run: node scripts/ci-run-tests.js build/lvgljs

  windows:
    name: Windows
    runs-on: windows-2025
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export GitHub Actions cache env (for vcpkg binary caching)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install vcpkg dependencies
        run: vcpkg install curl:x64-windows-static zlib:x64-windows-static libffi:x64-windows-static sdl2:x64-windows-static
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build the React UI bindings
        run: yarn build:ui
      - name: Bundle demos and tests
        run: yarn bundle
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DBUILD_LVGL_SIMULATOR=ON
      - name: Build lvgljs
        run: cmake --build build --config Release
      - name: Run tests
        run: node scripts/ci-run-tests.js build/Release/lvgljs.exe
